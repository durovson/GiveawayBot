name: Arena V2 checks
on:
  push:
    branches:
      - feature/bank-robber-arena-v2
      - main
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: pip install -r requirements.txt
      - name: Syntax and runtime interface validation
        env:
          BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: |
          python -m compileall -q bot.py handlers services middleware locales
          python -m unittest -v tests.test_arena_contracts tests.test_arena_runtime
